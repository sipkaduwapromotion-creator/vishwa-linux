name: Build Vishwa Linux ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get clean
          df -h /

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build debootstrap \
            xorriso squashfs-tools mtools dosfstools \
            isolinux syslinux syslinux-common syslinux-utils \
            grub-common grub-pc-bin grub-efi-amd64-bin \
            uuid-runtime rsync \
            librsvg2-bin fonts-dejavu-core
          lb --version || true

      - name: Normalise scripts
        run: |
          sudo find . -type f \( -name '*.sh' -o -path './auto/*' -o -path './config/hooks/*' \) \
            -exec sed -i 's/\r$//' {} +
          chmod +x auto/config auto/build auto/clean \
                   config/hooks/* tools/*.sh

      - name: Generate branding assets
        run: bash tools/build-assets.sh

      - name: Inspect live-build for Ubuntu-only packages
        run: |
          echo "=== live-build version ==="
          lb --version || true
          echo "=== all Check_package references ==="
          grep -rn "Check_package" /usr/lib/live/build 2>/dev/null || true
          echo "=== ubuntu references ==="
          grep -rn "ubuntu" /usr/lib/live/build 2>/dev/null || true
          echo "=== lb_binary_hooks ==="
          cat -n /usr/lib/live/build/lb_binary_hooks 2>/dev/null || true
          echo "=== lb_chroot_hooks ==="
          cat -n /usr/lib/live/build/lb_chroot_hooks 2>/dev/null || true
          echo "=== lb_binary_rootfs compression ==="
          grep -n "mksquashfs\|gzip\|COMPRESS\|compression\|comp " /usr/lib/live/build/lb_binary_rootfs 2>/dev/null || true
          echo "=== lb_config compression option ==="
          grep -n "compression\|--comp" /usr/lib/live/build/lb_config 2>/dev/null || true

      - name: Patch Ubuntu-only live-build syslinux behaviour
        run: |
          set -e
          f=/usr/lib/live/build/lb_binary_syslinux
          sudo sed -i \
            -e '/Check_package chroot\/usr\/share\/syslinux\/themes/d' \
            -e '/gfxboot-theme-ubuntu/d' \
            -e '/\${_TARGET}\/bootlogo/d' \
            -e 's|rsvg --format png --height 480 --width 640 splash\.svg splash\.png|rsvg-convert -w 640 -h 480 -o splash.png splash.svg|' \
            -e 's|rsvg --format png --height 480 --width 640 "\${_TARGET}/splash\.svg" "\${_TARGET}/splash\.png"|rsvg-convert -w 640 -h 480 -o "\${_TARGET}/splash.png" "\${_TARGET}/splash.svg"|' \
            "$f"
          sudo bash -n "$f" || echo "!! SYNTAX ERROR after patch"
          echo "===== relevant lines after patch ====="
          grep -n "rsvg\|bootlogo\|gfxboot\|syslinux/themes\|isolinux-live" "$f" || true

      - name: Force xz squashfs compression
        run: |
          set -e
          r=/usr/lib/live/build/lb_binary_rootfs
          # The Ubuntu live-build skips "-comp xz" when LB_MODE=ubuntu, which
          # makes the squashfs image gzip-compressed and the ISO ~300 MB larger.
          sudo sed -i '/-no-progress/a MKSQUASHFS_OPTIONS="${MKSQUASHFS_OPTIONS} -comp xz"' "$r"
          sudo bash -n "$r" || echo "!! SYNTAX ERROR in lb_binary_rootfs"
          grep -n -- "-comp xz" "$r" || true

      - name: Configure live-build
        run: sudo ./auto/config

      - name: Show resolved syslinux config
        run: |
          grep -n "SYSLINUX" config/common config/binary 2>/dev/null || true

      - name: Seed local syslinux bootloaders
        run: |
          set -e
          src=/usr/share/live/build/bootloaders/isolinux
          echo "=== $src ==="
          ls -la "$src" || true
          dest=config/bootloaders/isolinux
          mkdir -p "$dest"
          # Copy the live-build isolinux templates as *real* files. The
          # originals are absolute symlinks that dangle inside the Debian
          # bookworm chroot.
          for f in "$src"/*; do
            [ -e "$f" ] || continue
            cp -Lf "$f" "$dest/$(basename "$f")" 2>/dev/null || true
          done
          # Ensure the actual syslinux binaries/modules are present.
          cp -f /usr/lib/ISOLINUX/isolinux.bin "$dest/" 2>/dev/null || true
          cp -f /usr/lib/syslinux/modules/bios/*.c32 "$dest/" 2>/dev/null || true
          echo "=== $dest ==="
          ls -la "$dest"

      - name: Build ISO
        run: sudo ./auto/build

      - name: Collect ISO
        run: |
          set -e
          ISO="$(find . -maxdepth 1 -name '*.iso' | head -n1)"
          echo "Built ISO: $ISO"
          cp "$ISO" "Vishwa-Linux-1.0-amd64.iso"
          ls -lh Vishwa-Linux-1.0-amd64.iso
          du -h Vishwa-Linux-1.0-amd64.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: vishwa-linux-iso
          path: Vishwa-Linux-1.0-amd64.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Vishwa-Linux-1.0-amd64.iso
          generate_release_notes: true
