name: Inspect live-build

on:
  push:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Debian live-build
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libarchive-tools
          curl -fsSL -o /tmp/live-build.deb \
            http://deb.debian.org/debian/pool/main/l/live-build/live-build_20230502-1_all.deb
          sudo dpkg -i /tmp/live-build.deb || sudo apt-get -f install -y
          lb --version
          echo "=== lb config help (bootloader/compression/hooks options) ==="
          lb config --help | grep -iE "bootloader|compression|debian-installer|apt-recommends" || true

      - name: Resolve bootloaders config
        run: |
          set -e
          mkdir -p /tmp/t && cd /tmp/t
          rm -rf config .build
          lb config noauto \
            --binary-images iso-hybrid \
            --distribution bookworm \
            --parent-distribution bookworm \
            --bootloaders "syslinux grub-efi" \
            --compression xz || true
          echo "=== config/common ==="
          cat config/common 2>/dev/null | head -80 || true
          echo "=== config/binary bootloader refs ==="
          grep -n "BOOTLOADER" config/* 2>/dev/null || true

      - name: Hook locations in Debian live-build
        run: |
          echo "=== lb_binary_hooks ==="
          cat -n /usr/lib/live/build/lb_binary_hooks 2>/dev/null | sed -n '40,110p' || true
          echo "=== lb_chroot_hooks ==="
          cat -n /usr/lib/live/build/lb_chroot_hooks 2>/dev/null | sed -n '40,110p' || true