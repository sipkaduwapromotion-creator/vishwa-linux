<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07051a"/>
      <stop offset="45%" stop-color="#140a2e"/>
      <stop offset="100%" stop-color="#241257"/>
    </linearGradient>
    <radialGradient id="neb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6a4be0" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#6a4be0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2fd8ff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#2fd8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="34%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#a184ff"/>
      <stop offset="42%" stop-color="#6a4be0"/>
      <stop offset="100%" stop-color="#241148"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#46e2ff"/>
      <stop offset="52%" stop-color="#a06bff"/>
      <stop offset="100%" stop-color="#ff6bd6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a5cff" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#5b3fd6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5b3fd6" stop-opacity="0"/>
    </radialGradient>

    <g id="emblem">
      <circle cx="256" cy="256" r="238" fill="url(#glow)"/>
      <circle cx="256" cy="256" r="150" fill="url(#planet)"/>
      <ellipse cx="206" cy="204" rx="66" ry="48" fill="#ffffff" opacity="0.12"/>
      <g transform="rotate(-24 256 256)">
        <ellipse cx="256" cy="256" rx="236" ry="74" fill="none"
                 stroke="url(#ring)" stroke-width="16" stroke-linecap="round"/>
      </g>
      <circle cx="392" cy="140" r="20" fill="#ffe08a"/>
      <circle cx="392" cy="140" r="20" fill="none" stroke="#fff6d8" stroke-width="3" opacity="0.7"/>
    </g>
  </defs>

  <rect x="0" y="0" width="640" height="480" fill="url(#bg)"/>
  <ellipse cx="140" cy="100" rx="260" ry="190" fill="url(#neb1)"/>
  <ellipse cx="540" cy="430" rx="240" ry="180" fill="url(#neb2)"/>

  <g fill="#ffffff">
    <circle cx="60" cy="60" r="1.4" opacity="0.9"/>
    <circle cx="150" cy="35" r="1.0" opacity="0.6"/>
    <circle cx="490" cy="50" r="1.5" opacity="0.8"/>
    <circle cx="590" cy="100" r="1.0" opacity="0.55"/>
    <circle cx="50" cy="260" r="1.2" opacity="0.65"/>
    <circle cx="600" cy="260" r="1.3" opacity="0.7"/>
    <circle cx="340" cy="35" r="1.9" opacity="0.9"/>
    <circle cx="215" cy="185" r="1.7" opacity="0.85"/>
    <circle cx="430" cy="170" r="1.8" opacity="0.9"/>
  </g>

  <use xlink:href="#emblem" transform="translate(179,-21) scale(0.55)"/>

  <g font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle">
    <text x="320" y="255" font-size="30" font-weight="bold" letter-spacing="4" fill="#ffffff">VISHWA LINUX</text>
    <text x="320" y="285" font-size="15" letter-spacing="6" fill="#7fe3ff">1.0 (COSMOS)</text>
  </g>
</svg>
