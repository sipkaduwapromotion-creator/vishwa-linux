<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07051a"/>
      <stop offset="45%" stop-color="#140a2e"/>
      <stop offset="100%" stop-color="#241257"/>
    </linearGradient>
    <radialGradient id="neb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6a4be0" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#6a4be0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2fd8ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#2fd8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5cc8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff5cc8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="planet" cx="34%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#a184ff"/>
      <stop offset="42%" stop-color="#6a4be0"/>
      <stop offset="100%" stop-color="#241148"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#46e2ff"/>
      <stop offset="52%" stop-color="#a06bff"/>
      <stop offset="100%" stop-color="#ff6bd6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a5cff" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#5b3fd6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5b3fd6" stop-opacity="0"/>
    </radialGradient>

    <g id="emblem">
      <circle cx="256" cy="256" r="238" fill="url(#glow)"/>
      <circle cx="256" cy="256" r="150" fill="url(#planet)"/>
      <ellipse cx="206" cy="204" rx="66" ry="48" fill="#ffffff" opacity="0.12"/>
      <g transform="rotate(-24 256 256)">
        <ellipse cx="256" cy="256" rx="236" ry="74" fill="none"
                 stroke="url(#ring)" stroke-width="16" stroke-linecap="round"/>
      </g>
      <circle cx="392" cy="140" r="20" fill="#ffe08a"/>
      <circle cx="392" cy="140" r="20" fill="none" stroke="#fff6d8" stroke-width="3" opacity="0.7"/>
    </g>
  </defs>

  <!-- deep space background -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#bg)"/>

  <!-- nebulae -->
  <ellipse cx="330" cy="250" rx="620" ry="430" fill="url(#neb1)"/>
  <ellipse cx="1660" cy="880" rx="560" ry="400" fill="url(#neb2)"/>
  <ellipse cx="1560" cy="160" rx="420" ry="300" fill="url(#neb3)"/>
  <ellipse cx="250" cy="950" rx="480" ry="320" fill="url(#neb2)" opacity="0.6"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="90" r="1.6" opacity="0.9"/>
    <circle cx="310" cy="60" r="1.1" opacity="0.6"/>
    <circle cx="520" cy="150" r="1.8" opacity="0.8"/>
    <circle cx="700" cy="70" r="1.0" opacity="0.5"/>
    <circle cx="900" cy="130" r="1.5" opacity="0.7"/>
    <circle cx="1120" cy="60" r="1.2" opacity="0.6"/>
    <circle cx="1330" cy="120" r="1.9" opacity="0.85"/>
    <circle cx="1520" cy="70" r="1.0" opacity="0.5"/>
    <circle cx="1720" cy="140" r="1.6" opacity="0.75"/>
    <circle cx="1850" cy="60" r="1.1" opacity="0.55"/>
    <circle cx="80" cy="330" r="1.4" opacity="0.7"/>
    <circle cx="240" cy="430" r="1.0" opacity="0.5"/>
    <circle cx="470" cy="360" r="1.7" opacity="0.8"/>
    <circle cx="660" cy="470" r="1.1" opacity="0.6"/>
    <circle cx="1810" cy="330" r="1.5" opacity="0.75"/>
    <circle cx="1650" cy="430" r="1.0" opacity="0.5"/>
    <circle cx="1450" cy="360" r="1.7" opacity="0.8"/>
    <circle cx="1260" cy="470" r="1.1" opacity="0.6"/>
    <circle cx="110" cy="650" r="1.6" opacity="0.8"/>
    <circle cx="300" cy="720" r="1.0" opacity="0.5"/>
    <circle cx="1850" cy="640" r="1.6" opacity="0.8"/>
    <circle cx="1680" cy="730" r="1.0" opacity="0.5"/>
    <circle cx="1490" cy="660" r="1.4" opacity="0.7"/>
    <circle cx="130" cy="940" r="1.5" opacity="0.75"/>
    <circle cx="360" cy="1000" r="1.1" opacity="0.55"/>
    <circle cx="620" cy="930" r="1.7" opacity="0.8"/>
    <circle cx="880" cy="1010" r="1.0" opacity="0.5"/>
    <circle cx="1140" cy="940" r="1.6" opacity="0.75"/>
    <circle cx="1400" cy="1010" r="1.1" opacity="0.55"/>
    <circle cx="1640" cy="950" r="1.7" opacity="0.8"/>
    <circle cx="1850" cy="1010" r="1.2" opacity="0.6"/>
    <circle cx="400" cy="230" r="2.2" opacity="0.95"/>
    <circle cx="1560" cy="260" r="2.0" opacity="0.9"/>
    <circle cx="760" cy="980" r="2.1" opacity="0.9"/>
    <circle cx="1180" cy="820" r="1.9" opacity="0.85"/>
  </g>

  <!-- emblem -->
  <use xlink:href="#emblem" transform="translate(640,30) scale(1.25)"/>

  <!-- wordmark -->
  <g font-family="DejaVu Sans, Verdana, sans-serif" text-anchor="middle">
    <text x="960" y="800" font-size="118" font-weight="bold" letter-spacing="20" fill="#ffffff">VISHWA</text>
    <text x="960" y="885" font-size="52" font-weight="bold" letter-spacing="34" fill="#7fe3ff">LINUX</text>
    <text x="960" y="960" font-size="24" letter-spacing="10" fill="#b9a7ff" opacity="0.85">A COSMIC DEBIAN EXPERIENCE</text>
  </g>
</svg>
